name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: renderer

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: Tests
        run: cargo nextest run --all-targets

      # Überlauf-Semantik unterscheidet sich zwischen Debug und Release; die
      # Prüfungen im Regionsleser müssen in beiden greifen.
      - name: Tests (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --all-targets --release

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: renderer/Cargo.toml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: renderer/lcov.info
