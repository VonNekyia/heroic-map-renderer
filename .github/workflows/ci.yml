name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: renderer

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Hier gibt es immer einen Software-Adapter (unten); fehlt er, ist das
    # ein Fehler und kein übersprungener GPU-Test.
    env:
      HEROIC_GPU_PFLICHT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Die GPU-Tests brauchen einen Adapter. Auf Windows ist WARP dabei,
      # auf Ubuntu liefert Mesa mit lavapipe eine Vulkan-Implementierung
      # in Software — langsam, aber derselbe Shader-Weg wie auf einer Karte.
      - name: Software-Vulkan für die GPU-Tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - uses: taiki-e/install-action@nextest

      - name: Tests
        timeout-minutes: 20
        run: cargo nextest run --all-targets

      # Das Goldbild sagt nur, dass sich etwas geändert hat. Ohne das
      # Ist-Bild ist im Log nicht zu sehen, was.
      - name: Goldbild-Abweichung sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldbild-ist-${{ matrix.os }}
          path: renderer/tests/fixtures/golden/metatile*-ist.png
          if-no-files-found: ignore

      # Überlauf-Semantik unterscheidet sich zwischen Debug und Release; die
      # Prüfungen im Regionsleser müssen in beiden greifen.
      - name: Tests (release)
        timeout-minutes: 15
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --all-targets --release

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Browser
        run: npx playwright install --with-deps chromium

      # Unter public/tiles liegt oft ein Link auf einen grossen Render. Der
      # Build darf ihn nicht nach dist kopieren.
      - name: Kacheln bleiben aus dem Build
        run: |
          mkdir -p public/tiles/0/0 && touch public/tiles/0/0/0.webp
          npm run build
          test ! -e dist/tiles && test -f dist/tiles-demo/map.json

      - name: Smoke-Test
        timeout-minutes: 5
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Das Chromium von Playwright hat eine feste Version, das Chrome des
      # Runners nicht.
      - name: Browser
        run: |
          npx playwright install --with-deps --no-shell chromium
          echo "CHROME_PATH=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"

      # Ausgeliefert wie in Produktion: die Kacheln als tiles/ neben der Seite.
      - name: Build mit Kacheln daneben
        run: |
          npm run build
          cp -r dist/tiles-demo dist/tiles

      - name: Lighthouse
        timeout-minutes: 5
        run: npx lhci collect --config=./lighthouserc.cjs

      - name: Werte je Lauf
        run: |
          node -e "
          const fs = require('fs');
          for (const f of fs.readdirSync('.lighthouseci').filter((f) => /^lhr-.*\.json$/.test(f))) {
            const r = JSON.parse(fs.readFileSync('.lighthouseci/' + f));
            const k = Object.entries(r.categories).map(([n, c]) => n + ' ' + c.score).join(', ');
            const a = (id) => Math.round(r.audits[id].numericValue * 1000) / 1000;
            console.log(k + ' | CLS ' + a('cumulative-layout-shift') + ' | TBT ' + a('total-blocking-time') + ' ms | LCP ' + a('largest-contentful-paint') + ' ms');
          }"

      - name: Berichte schreiben
        if: always()
        run: npx lhci upload --config=./lighthouserc.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse
          retention-days: 14

      - name: Schwellen
        run: npx lhci assert --config=./lighthouserc.cjs

  doku:
    name: Doku
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Verweise, Links und Frontmatter
        timeout-minutes: 5
        run: bash .github/pruefe-doku.sh

      # Die Probe verbiegt je einen Verweis, eine Überschrift, einen Link und
      # einen Pfad unter code: und nimmt einer Seite den title. Die Prüfung
      # muss alle fünf melden. Ihre Meldungen stehen mit Präfix im Log, sonst
      # heftete GitHub sie als Fehler an die PR.
      - name: Probe, dass die Prüfung anschlägt
        timeout-minutes: 5
        run: |
          sed -i '0,/Siehe docs\/renderer\/renderpfad\.md/s//Siehe docs\/renderer\/gibt-es-nicht.md/' renderer/src/render/metatile.rs
          sed -i '0,/„Vorlauf“/s//„Gibt es nicht“/' renderer/src/cli.rs
          sed -i '0,/](docs\/index\.md)/s//](docs\/gibt-es-nicht.md)/' README.md
          sed -i '0,/^  - renderer\/src\/render\/gpu\.rs$/s//  - renderer\/src\/render\/gibt-es-nicht.rs/' docs/benutzung/grafikkarte.md
          sed -i '0,/^title: /{//d}' docs/benutzung/zoomstufen.md
          test "$(git diff --name-only | wc -l)" -eq 5
          if bash .github/pruefe-doku.sh > probe.txt; then
            echo "Die Prüfung hat nichts gemeldet."
            exit 1
          fi
          sed 's/^::error /Probe: /' probe.txt
          test "$(grep -c '^::error ' probe.txt)" -eq 5

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: renderer/Cargo.toml

      # Bricht ab, wenn zu einer Crate im Binär der Lizenztext fehlt.
      - name: Hinweise auf Drittlizenzen
        timeout-minutes: 10
        run: python3 drittlizenzen.py hinweise

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HEROIC_GPU_PFLICHT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Software-Vulkan für die GPU-Tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        timeout-minutes: 20
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: renderer/lcov.info
