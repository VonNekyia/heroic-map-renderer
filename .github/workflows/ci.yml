name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: renderer

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Die GPU-Tests brauchen einen Adapter. Auf Windows ist WARP dabei,
      # auf Ubuntu liefert Mesa mit lavapipe eine Vulkan-Implementierung
      # in Software — langsam, aber derselbe Shader-Weg wie auf einer Karte.
      - name: Software-Vulkan für die GPU-Tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - uses: taiki-e/install-action@nextest

      - name: Tests
        run: cargo nextest run --all-targets

      # Das Goldbild sagt nur, dass sich etwas geändert hat. Ohne das
      # Ist-Bild ist im Log nicht zu sehen, was.
      - name: Goldbild-Abweichung sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goldbild-ist-${{ matrix.os }}
          path: renderer/tests/fixtures/golden/metatile-ist.png
          if-no-files-found: ignore

      # Überlauf-Semantik unterscheidet sich zwischen Debug und Release; die
      # Prüfungen im Regionsleser müssen in beiden greifen.
      - name: Tests (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run --all-targets --release

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Browser
        run: npx playwright install --with-deps chromium

      # Unter public/tiles liegt oft ein Link auf einen grossen Render. Der
      # Build darf ihn nicht nach dist kopieren.
      - name: Kacheln bleiben aus dem Build
        run: |
          mkdir -p public/tiles/0/0 && touch public/tiles/0/0/0.webp
          npm run build
          test ! -e dist/tiles && test -f dist/tiles-demo/map.json

      - name: Smoke-Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: renderer/Cargo.toml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: renderer/lcov.info
