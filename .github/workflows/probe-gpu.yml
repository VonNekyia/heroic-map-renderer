# Probe zu #446: Stürzt tests/gpu.rs unter Coverage mit nextest noch ab?
# Je Variante 40 Läufe von tests/gpu.rs, instrumentiert wie im Coverage-Job:
# einmal mit cargo llvm-cov (Threads in einem Prozess, wie heute), einmal mit
# cargo llvm-cov nextest (ein Prozess je Test). Nur auf diesem Zweig.
name: Probe GPU

on:
  push:
    branches: [probe/gpu-sigsegv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEROIC_GPU_PFLICHT: "1"
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer

      - name: Software-Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: taiki-e/install-action@nextest

      # Der erste Lauf baut; er zählt nicht.
      - name: Bauen
        timeout-minutes: 30
        run: |
          cargo llvm-cov --test gpu --no-report -- --list
          cargo llvm-cov nextest --test gpu --no-report --no-clean || true

      - name: Läufe
        timeout-minutes: 50
        run: |
          lauf() {
            local name=$1; shift
            local ab=0 rot=0
            for i in $(seq 1 40); do
              if ! timeout 300 "$@" > /tmp/l.txt 2>&1; then
                rot=$((rot + 1))
                if grep -q "SIGSEGV\|SIGABRT\|SIGBUS\|signal: 11\|signal: 6" /tmp/l.txt; then
                  ab=$((ab + 1))
                fi
                if [ "$rot" -le 2 ]; then
                  echo "::group::$name, Lauf $i"
                  tail -60 /tmp/l.txt
                  echo "::endgroup::"
                fi
              fi
            done
            echo "$name: $rot von 40 rot, davon $ab abgestürzt" | tee -a ../ergebnis.txt
          }
          lauf "cargo llvm-cov, Threads" cargo llvm-cov --test gpu --no-report --no-clean
          lauf "cargo llvm-cov nextest, Prozesse" cargo llvm-cov nextest --test gpu --no-report --no-clean
          cat ../ergebnis.txt
