# Probe, nicht mergen: libwebp für unsere Kacheln zuschneiden, als Leiter von
# Varianten gegen heute; dazu das Entpacken der Chunkdaten mit zwei Backends.
# Läuft nur auf Zweigen probe/**.
name: Probe

on:
  push:
    branches: ["probe/**"]

jobs:
  leiter:
    name: libwebp zuschneiden, Entpacken
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
      - name: Bauen
        run: |
          cargo test --release --test probe_leiter --test probe_entpacken --no-run
          cargo test --release --features probe-zlib-rs --test probe_entpacken --no-run
      - name: Entpacken messen
        run: |
          for runde in 1 2 3; do
            for art in "" "--features probe-zlib-rs"; do
              cargo test --release $art --test probe_entpacken -- --ignored --nocapture > aus.txt 2>&1 || { tail -40 aus.txt; exit 1; }
              grep '^PROBE4' aus.txt
            done
          done
      - name: Leiter messen
        run: |
          for runde in 1 2 3; do
            cargo test --release --test probe_leiter -- --ignored --nocapture > aus.txt 2>&1 || { tail -40 aus.txt; exit 1; }
            grep '^PROBE3' aus.txt
          done
