# Probe, nicht mergen: eigene Vorstufen, die die Farben einer Kachel runden,
# bevor libwebp sie verlustfrei packt, gegen near-lossless und
# verlustbehaftet. Läuft nur auf Zweigen probe/**.
name: Probe

on:
  push:
    branches: ["probe/**"]

jobs:
  farben:
    name: Vorstufen für die Farben
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
      - name: Bauen
        run: cargo test --release --test probe_farben --no-run
      - name: Pyramide messen
        run: |
          for runde in 1 2 3; do
            cargo test --release --test probe_farben probe_farben_pyramide -- --exact --ignored --nocapture > aus.txt 2>&1 || { tail -40 aus.txt; exit 1; }
            grep '^PROBE8' aus.txt
          done
