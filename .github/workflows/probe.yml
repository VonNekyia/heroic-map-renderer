# Probe, nicht mergen: Verlust je Stufe der Pyramide, wenn Eltern aus den
# dekodierten Kindern entstehen und die Kacheln near-lossless oder
# verlustbehaftet gepackt sind. Läuft nur auf Zweigen probe/**.
name: Probe

on:
  push:
    branches: ["probe/**"]

jobs:
  pyramide:
    name: Verlust je Stufe der Pyramide
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
      - name: Bauen
        run: cargo test --release --test probe_pyramide --no-run
      - name: Pyramide messen
        run: |
          for runde in 1 2 3; do
            cargo test --release --test probe_pyramide -- --ignored --nocapture > aus.txt 2>&1 || { tail -40 aus.txt; exit 1; }
            grep '^PROBE6' aus.txt
          done
