# Probe, nicht mergen: Zeit und Bytes von libwebp unter Linux mit allen
# SIMD-Stufen, nur SSE2 und ohne SIMD. Läuft nur auf Zweigen probe/**.
name: Probe

on:
  push:
    branches: ["probe/**"]

jobs:
  simd:
    name: libwebp SIMD unter Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: renderer
      - name: Bauen
        run: cargo test --release --test probe_simd --no-run
      - name: Stehen SSE4.1 und AVX2 im Binär?
        run: |
          for f in target/release/deps/probe_simd-*; do
            [ -x "$f" ] && [ ! -d "$f" ] || continue
            echo "PROBE symbole avx2=$(nm "$f" | grep -c '_AVX2') sse41=$(nm "$f" | grep -c '_SSE41') sse2=$(nm "$f" | grep -c '_SSE2')"
            nm "$f" | grep -E ' [tT] (VP8LEncDspInit(AVX2|SSE41)|VP8LDspInit(AVX2|SSE41)|VectorMismatch_AVX2)$' | sed 's/^/PROBE symbol /'
          done
      - name: Messen
        run: |
          for m in alle sse2 ohne alle sse2 ohne alle sse2 ohne; do
            PROBE_SIMD=$m cargo test --release --test probe_simd -- --ignored --nocapture 2>&1 | grep '^PROBE'
          done
