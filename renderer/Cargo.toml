[package]
name = "heroic-map-renderer"
version = "0.1.0"
edition = "2024"
description = "Isometrischer Offline-Renderer für Minecraft-Java-Welten"
license = "Apache-2.0"
publish = false

[[bin]]
name = "heroic-map-renderer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastnbt = "2"                       # NBT; simdnbt 0.10 ist nightly-only
flate2 = "1"                        # gzip/zlib der Chunkdaten
image = { version = "0.25", default-features = false, features = ["png"] }
libwebp-sys = "0.14"                # WebP kodieren und dekodieren, libwebp aus dem mitgelieferten C-Quelltext
lz4-java-wrc = "0.2"                # Kompressionsverfahren 4 (Paper)
mimalloc = "0.1"                    # Windows-Heap serialisiert 24 Threads beim Chunk-Dekodieren
pollster = "1"
rayon = "1"                          # Parallelisierung ueber Kacheln
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }  # Reihenfolge und Zahlen wie Gson
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }  # ohne GL: lief nirgends in der CI

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }  # Junction oder Symlink, wie Java sie unterscheidet

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }  # WebP unabhängig von libwebp prüfen
tempfile = "3"

[profile.release]
opt-level = 3
codegen-units = 1

# Der GPU-Stapel und clap auf Grösse statt Tempo: kleiner um rund ein Zehntel
# gepackt, ohne messbare Kosten. Siehe docs/entwicklung/weitergabe.md.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.wgpu-core]
opt-level = "s"
[profile.release.package.wgpu-hal]
opt-level = "s"
[profile.release.package.wgpu]
opt-level = "s"
[profile.release.package.ash]
opt-level = "s"
[profile.release.package.gpu-allocator]
opt-level = "s"
[profile.release.package.clap_builder]
opt-level = "s"

# Für Mutationen: rechnet wie release, baut nach einer Änderung schneller.
# Gemessen wird weiter mit release. Siehe docs/entwicklung/tests.md.
[profile.mutation]
inherits = "release"
codegen-units = 16
incremental = true

# Testbauten mit Optimierung; die Prüfungen des Debug-Builds bleiben an.
# Siehe docs/entwicklung/tests.md.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
