[package]
name = "heroic-map-renderer"
version = "0.2.1"
edition = "2024"
description = "Isometrischer Offline-Renderer für Minecraft-Java-Welten"
license = "Apache-2.0"
publish = false

[[bin]]
name = "heroic-map-renderer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastnbt = "2"                       # NBT; simdnbt 0.10 ist nightly-only
flate2 = "1"                        # gzip/zlib der Chunkdaten
http-body-util = "0.1"              # Körper der Antworten von --serve
httpdate = "1"                      # Last-Modified für --serve; steckt schon über hyper im Baum
hyper = { version = "1", features = ["server", "client", "http1"] }  # HTTP für --serve und das Client-Jar, siehe docs/entscheidungen/0084-server-im-renderer.md und 0086
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libwebp-sys = "0.14"                # WebP kodieren und dekodieren, libwebp aus dem mitgelieferten C-Quelltext; die Kopie unten
lz4-java-wrc = "0.2"                # Kompressionsverfahren 4 (Paper)
mimalloc = "0.1"                    # Windows-Heap serialisiert 24 Threads beim Chunk-Dekodieren
pollster = "1"
rayon = "1"                          # Parallelisierung ueber Kacheln
ring = "0.17"                        # HMAC der Token für /download/; steckt schon über rustls im Baum
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }  # HTTPS für --serve, nur TLS 1.3, siehe docs/entscheidungen/0084-server-im-renderer.md
rustls-pki-types = { version = "1", features = ["std"] }  # PEM für --tls-cert und --tls-key
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }  # Reihenfolge und Zahlen wie Gson
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }  # Laufzeit für --serve
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "dx12", "metal"] }  # ohne GL: lief nirgends in der CI

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console"] }  # Junction oder Symlink, wie Java sie unterscheidet; Priorität für --low-priority; die Konsole des Assistenten
rfd = { version = "0.17", default-features = false }  # Ordnerdialog des Assistenten, nur Windows, siehe docs/entscheidungen/0087-assistent-auf-der-konsole.md

[target.'cfg(unix)'.dependencies]
libc = "0.2"                         # Priorität für --low-priority; steckt schon über wgpu im Baum

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }  # WebP unabhängig von libwebp prüfen
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }  # Zertifikate für die Tests von HTTPS

[profile.release]
opt-level = 3
codegen-units = 1
# Unter Linux liegen die Symbole im Binär; ohne sie passt es ins Budget
# des Jars. Siehe docs/entwicklung/weitergabe.md.
strip = "symbols"

# Der GPU-Stapel und clap auf Grösse statt Tempo: kleiner um rund ein Zehntel
# gepackt, ohne messbare Kosten. Siehe docs/entwicklung/weitergabe.md.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.wgpu-core]
opt-level = "s"
[profile.release.package.wgpu-hal]
opt-level = "s"
[profile.release.package.wgpu]
opt-level = "s"
[profile.release.package.ash]
opt-level = "s"
[profile.release.package.gpu-allocator]
opt-level = "s"
[profile.release.package.clap_builder]
opt-level = "s"

# Für Mutationen: rechnet wie release, baut nach einer Änderung schneller.
# Gemessen wird weiter mit release. Siehe docs/entwicklung/tests.md.
[profile.mutation]
inherits = "release"
codegen-units = 16
incremental = true

# Testbauten mit Optimierung; die Prüfungen des Debug-Builds bleiben an.
# Siehe docs/entwicklung/tests.md.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# libwebp-sys mit einem Patch an libwebp für --compact, siehe
# docs/entwicklung/libwebp-mit-patch.md.
[patch.crates-io]
libwebp-sys = { path = "vendor/libwebp-sys" }
