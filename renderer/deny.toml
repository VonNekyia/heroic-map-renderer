[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Genau die Lizenzen, die der aktuelle Abhängigkeitsbaum mitbringt. Eine neue
# Lizenz lässt cargo-deny fehlschlagen — das ist der Sinn der Sache.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
